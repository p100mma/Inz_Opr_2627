
<!DOCTYPE html>

<head>

  <title>Quizy — Inżynieria oprogramowania</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;

    }

      padding: 22px;

      transition: transform 0.15s, border-color 0.15s;

    a:hover, a:focus-visible {

      border-color: #647fce;
      outline: none;
    }

    .number {
      color: #647fce;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

      margin: 0;
      color: #64748b;
